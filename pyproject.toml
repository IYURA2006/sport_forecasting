[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wc26"
version = "0.1.0"
description = "World Cup 2026 probabilistic forecasting engine (Dixon-Coles, market-relative evaluation)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (parameter recovery, large MC budgets)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["wc26"]

# Only silence missing stubs for known stub-less third-party libs, so a typo'd
# internal import (e.g. wc26.modles) still fails resolution.
[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "matplotlib.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["wc26.models", "wc26.eval", "wc26.sim"]
